<!DOCTYPE html>
<html>
    <head>
        <title>Soumya Mehar</title>
        <style>
            :root {
                color-scheme: light;
                --page-bg: #ffffff;
                --text-color: #1f2937;
                --surface-bg: #ffffff;
                --border-color: #9ca3af;
                --table-header-bg: #f0f0f0;
                --switch-track: #d1d5db;
                --switch-active: #2563eb;
            }

            :root[data-theme="dark"] {
                color-scheme: dark;
                --page-bg: #171a21;
                --text-color: #e5e7eb;
                --surface-bg: #222631;
                --border-color: #596273;
                --table-header-bg: #343b49;
                --switch-track: #4b5563;
                --switch-active: #60a5fa;
            }

            body {
                background: var(--page-bg);
                color: var(--text-color);
                font-family: Arial, sans-serif;
                transition: background-color 180ms ease, color 180ms ease;
            }

            input,
            button {
                background: var(--surface-bg);
                color: var(--text-color);
                border: 1px solid var(--border-color);
                border-radius: 4px;
                padding: 6px 8px;
            }

            button {
                cursor: pointer;
            }

            table {
                border-color: var(--border-color);
                color: var(--text-color);
            }

            th,
            td {
                border-color: var(--border-color);
            }

            .page-heading {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
                flex-wrap: wrap;
            }

            .theme-toggle {
                display: inline-flex;
                align-items: center;
                gap: 10px;
                font-size: 14px;
                cursor: pointer;
            }

            .theme-toggle input {
                appearance: none;
                width: 42px;
                height: 24px;
                padding: 0;
                border: 0;
                border-radius: 999px;
                background: var(--switch-track);
                cursor: pointer;
                position: relative;
                transition: background-color 180ms ease;
            }

            .theme-toggle input::before {
                content: "";
                position: absolute;
                top: 3px;
                left: 3px;
                width: 18px;
                height: 18px;
                border-radius: 50%;
                background: #ffffff;
                transition: transform 180ms ease;
            }

            .theme-toggle input:checked {
                background: var(--switch-active);
            }

            .theme-toggle input:checked::before {
                transform: translateX(18px);
            }

            .theme-toggle input:focus-visible {
                outline: 2px solid var(--switch-active);
                outline-offset: 3px;
            }
        </style>
    </head>
    <body>

        <header class="page-heading">
            <h2>Soumya Mehar_24070521200</h2>
            <label class="theme-toggle">
                <span id="themeLabel">Light theme</span>
                <input type="checkbox" id="themeSwitch" role="switch" aria-label="Use dark theme">
            </label>
        </header>

        <form id="billingForm">
            <label>Customer Name: <input type="text" id="customerName" required></label><br><br>
            
            <h3>Add Products</h3>
            <label>Product Name: <input type="text" id="productName" required></label><br><br>
            <label>Quantity: <input type="number" id="quantity" required></label><br><br>
            <label>Price per Item (₹): <input type="number" id="price" step="0.01" required></label><br><br>
            <button type="button" onclick="addProduct()">Add Product</button>
            <button type="button" onclick="calculateBill()">Calculate Bill</button>
            <button type="button" onclick="resetForm()">Reset</button>
        </form>

        <div id="productList"></div>
        <div id="receipt"></div>

        <script>
            // Using var to store products array
            var products = [];
            const themeSwitch = document.getElementById("themeSwitch");
            const themeLabel = document.getElementById("themeLabel");
            const savedTheme = localStorage.getItem("billing-theme");
            themeSwitch.checked = savedTheme === "dark";
            document.documentElement.dataset.theme = themeSwitch.checked ? "dark" : "light";
            themeLabel.textContent = themeSwitch.checked ? "Dark theme" : "Light theme";

            themeSwitch.addEventListener("change", function () {
                const theme = themeSwitch.checked ? "dark" : "light";
                document.documentElement.dataset.theme = theme;
                themeLabel.textContent = theme === "dark" ? "Dark theme" : "Light theme";
                localStorage.setItem("billing-theme", theme);
            });

            function addProduct() {
                const productName = document.getElementById("productName").value;
                let quantity = Number(document.getElementById("quantity").value);
                let price = Number(document.getElementById("price").value);

                if (!productName || quantity <= 0 || price <= 0) {
                    alert("Please enter valid product details");
                    return;
                }

                // Create product object
                const product = {
                    name: productName,
                    qty: quantity,
                    unitPrice: price,
                    subtotal: quantity * price
                };

                // Add to products array
                products.push(product);

                // Clear input fields
                document.getElementById("productName").value = "";
                document.getElementById("quantity").value = "";
                document.getElementById("price").value = "";

                // Display products list
                displayProductsList();
            }

            function displayProductsList() {
                if (products.length === 0) {
                    document.getElementById("productList").innerHTML = "";
                    return;
                }

                let productTable = `
                    <h3>Added Products</h3>
                    <table border="1" cellpadding="10" style="margin-bottom: 20px;">
                        <tr style="background-color: var(--table-header-bg);">
                            <th>Product Name</th>
                            <th>Quantity</th>
                            <th>Unit Price (₹)</th>
                            <th>Subtotal (₹)</th>
                            <th>Action</th>
                        </tr>
                `;

                // Using let for loop variable
                for (let i = 0; i < products.length; i++) {
                    const { name, qty, unitPrice, subtotal } = products[i];
                    productTable += `
                        <tr>
                            <td>${name}</td>
                            <td>${qty}</td>
                            <td>${unitPrice.toFixed(2)}</td>
                            <td>${subtotal.toFixed(2)}</td>
                            <td><button type="button" onclick="removeProduct(${i})">Remove</button></td>
                        </tr>
                    `;
                }

                productTable += `</table>`;
                document.getElementById("productList").innerHTML = productTable;
            }

            function removeProduct(index) {
                products.splice(index, 1);
                displayProductsList();
            }

            function calculateBill() {
                const GST = 0.18;
                var customerName = document.getElementById("customerName").value;

                if (!customerName) {
                    alert("Please enter customer name");
                    return;
                }

                if (products.length === 0) {
                    alert("Please add at least one product");
                    return;
                }

                // Calculate grand total
                let grandTotal = 0;
                for (let i = 0; i < products.length; i++) {
                    grandTotal += products[i].subtotal;
                }

                let gstAmount = grandTotal * GST;
                let finalBill = grandTotal + gstAmount;

                // Create bill object
                const bill = {
                    customer: customerName,
                    grandTotal,
                    gstAmount,
                    finalBill
                };

                // Destructuring with aliasing
                const {
                    customer,
                    grandTotal: total,
                    gstAmount: gst,
                    finalBill: amount
                } = bill;

                // Generate receipt with template literals
                let receipt = `
                    <h3>Billing Receipt</h3>
                    <p><strong>Customer:</strong> ${customer}</p>
                    <p style="margin-bottom: 20px;"><strong>Date:</strong> ${new Date().toLocaleDateString()}</p>
                    
                    <table border="1" cellpadding="10" style="margin-bottom: 20px;">
                        <tr style="background-color: var(--table-header-bg);">
                            <th>Product Name</th>
                            <th>Quantity</th>
                            <th>Unit Price (₹)</th>
                            <th>Subtotal (₹)</th>
                        </tr>
                `;

                // Add all products to receipt
                for (let i = 0; i < products.length; i++) {
                    const { name, qty, unitPrice, subtotal } = products[i];
                    receipt += `
                        <tr>
                            <td>${name}</td>
                            <td>${qty}</td>
                            <td>${unitPrice.toFixed(2)}</td>
                            <td>${subtotal.toFixed(2)}</td>
                        </tr>
                    `;
                }

                receipt += `</table>`;
                receipt += `
                    <p style="font-size: 16px;"><strong>Grand Total:</strong> ₹${total.toFixed(2)}</p>
                    <p style="font-size: 16px;"><strong>GST Amount (18%):</strong> ₹${gst.toFixed(2)}</p>
                    <hr>
                    <p style="font-size: 18px; color: green;"><strong>Final Bill Amount:</strong> ₹${amount.toFixed(2)}</p>
                `;

                document.getElementById("receipt").innerHTML = receipt;
            }

            function resetForm() {
                products = [];
                document.getElementById("customerName").value = "";
                document.getElementById("productName").value = "";
                document.getElementById("quantity").value = "";
                document.getElementById("price").value = "";
                document.getElementById("productList").innerHTML = "";
                document.getElementById("receipt").innerHTML = "";
            }
        </script>

    </body>
