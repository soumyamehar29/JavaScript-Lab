<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soumya Palindrome Checker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <section class="card">
      <div class="card-header">
        <h1>Palindrome Checker</h1>
        <button id="themeToggle" class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Dark theme">
          <span class="theme-toggle-track" aria-hidden="true"><span class="theme-toggle-thumb"></span></span>
          <span class="theme-toggle-label">Dark</span>
        </button>
      </div>

      <label for="textInput" class="sr-only">Enter text</label>
      <input
        id="textInput"
        type="text"
        placeholder="Enter a word or sentence"
        autocomplete="off"
      />

      <div class="button-row">
        <button id="checkBtn" type="button">Check</button>
        <button id="clearBtn" type="button" class="secondary">Clear</button>
      </div>

      <div id="resultBox" class="result-box" aria-live="polite"></div>
      <p id="checkCount" class="check-count">Total checks: 0</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
