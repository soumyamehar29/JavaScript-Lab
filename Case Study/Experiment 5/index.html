<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array & Loop Neon Studio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>⚡ ARRAY & LOOP NEON STUDIO</h1>
        <p class="subtitle">Roll No: 24070521200</p>

        <!-- Mutations & Operations Section -->
        <div class="section">
            <h2>Mutations & Operations</h2>
            
            <div class="input-group">
                <span class="label">Enter Numbers (comma-separated):</span>
                <input type="text" id="array-input" placeholder="e.g., 100, 30, 25, 22" value="100, 30, 25, 22">
            </div>

            <div class="button-group">
                <button onclick="performPush()">Push</button>
                <button onclick="performPop()">Pop</button>
                <button onclick="performUnshift()">Unshift</button>
                <button onclick="performSplice()">Splice</button>
            </div>

            <div class="array-display" id="array-display">Array: [100, 30, 25, 22]</div>

            <button onclick="findMaxMin()" style="width: 100%; margin-top: 15px;">Find Max & Min</button>

            <div class="output" id="result-output"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
