<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart Total Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <div class="card">
        <h1>Soumya Calculator</h1>
        <p class="subtitle">Add items and see your discount instantly.</p>

        <form id="cartForm">
          <label for="itemName">Item name</label>
          <input id="itemName" name="itemName" type="text" placeholder="Enter item" required />

          <label for="itemPrice">Price</label>
          <input id="itemPrice" name="itemPrice" type="number" min="0" step="0.01" placeholder="0" required />

          <button type="submit">Add Item</button>
        </form>

        <div class="cart-box">
          <h2>Your Cart</h2>
          <ul id="cartItems"></ul>
        </div>

        <div class="summary">
          <div><span>Subtotal</span><strong id="subtotal">₹0</strong></div>
          <div><span>Discount</span><strong id="discountRate">0%</strong></div>
          <div><span>Discount Amount</span><strong id="discountAmount">₹0</strong></div>
          <div class="final"><span>Total</span><strong id="total">₹0</strong></div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
