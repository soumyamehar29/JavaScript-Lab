<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soumya Mehar - Student Records</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <section class="intro" aria-labelledby="page-title">
      <h1 id="page-title">Soumya Mehar (24070521200)</h1>
    </section>

    <section class="workspace" aria-label="Student records">
      <div class="toolbar">
        <div>
          <p class="section-label">Student records</p>
          <p class="source-name"><span class="status-dot" aria-hidden="true"></span>Academic details</p>
        </div>
        <div class="actions">
          <button class="button button-primary" id="fetch-button" type="button">Load with fetch()</button>
          <button class="button button-secondary" id="jquery-button" type="button">Load with $.getJSON()</button>
        </div>
      </div>

      <div class="status" id="status" role="status" aria-live="polite">Choose a loader to display the student records.</div>

      <div class="table-wrap">
        <table>
          <caption class="sr-only">Student records</caption>
          <thead>
            <tr>
              <th scope="col">Name</th>
              <th scope="col">PRN</th>
              <th scope="col">Branch</th>
              <th scope="col">Semester</th>
              <th scope="col">CGPA</th>
            </tr>
          </thead>
          <tbody id="results-body">
            <tr class="empty-row">
              <td colspan="5">Your loaded records will appear here.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
